[package]
name = "breaker"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Async circuit breaker for Rust — state machine with configurable thresholds, metrics, and Tower layer integration"
readme = "README.md"
repository = "https://github.com/WyattAu/breaker"
keywords = ["circuit-breaker", "resilience", "fault-tolerance"]
categories = ["rust-patterns"]

[dependencies]
tokio = { version = "1", features = ["time", "sync"] }
parking_lot = "0.12"
thiserror = "2"
tracing = "0.1"
metrics = { version = "0.24", optional = true }

tower = { version = "0.5", optional = true }
tower-layer = { version = "0.3", optional = true }
http = { version = "1", optional = true }
axum = { version = "0.8", optional = true }

[features]
default = ["std"]
std = []
metrics = ["dep:metrics"]
tower = ["dep:tower", "dep:tower-layer", "dep:http", "dep:axum"]

[[bench]]
name = "call_overhead"
harness = false

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

# Model-checking tests (see tests/loom.rs). Activated only with
# RUSTFLAGS="--cfg loom"; the lib swaps parking_lot::RwLock for loom's.
[target.'cfg(loom)'.dependencies]
loom = { version = "0.7", features = ["futures"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(kani)'] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
indexing_slicing = "deny"
panic = "deny"
