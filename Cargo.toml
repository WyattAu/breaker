[package]
name = "breaker"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Async circuit breaker for Rust — sliding-window tripping, half-open probe permits, backoff strategies, typed errors, and a real Tower layer"
readme = "README.md"
repository = "https://github.com/WyattAu/breaker"
keywords = ["circuit-breaker", "resilience", "fault-tolerance"]
categories = ["rust-patterns"]
exclude = ["/target"]

[dependencies]
parking_lot = "0.12"
thiserror = "2"
metrics = { version = "0.24", optional = true }
# Only pulled in when the `timeout` feature is enabled; the core crate has
# no mandatory async-runtime dependency.
tokio = { version = "1", default-features = false, features = ["time"], optional = true }
# Real Tower integration (`tower` feature): Service + Layer + types.
tower = { version = "0.5", default-features = false, optional = true }
tower-layer = { version = "0.3", default-features = false, optional = true }


[features]
default = ["std"]
std = []
metrics = ["dep:metrics"]
# Real Tower middleware: `BreakerLayer`/`BreakerService` wrapping any
# `tower::Service`. Compatible with Axum/Tonic routers via `tower_layer`.
# `tower/util` is included so layer users get `ServiceExt` (`ready`,
# `oneshot`) and `service_fn` — the standard middleware toolkit.
tower = ["dep:tower", "dep:tower-layer", "tower/util"]
# Optional per-call timeout via `tokio::time::timeout`. Timed-out calls
# count as failures and surface as `CircuitBreakerError::Timeout`.
timeout = ["dep:tokio"]

[[bench]]
name = "call_overhead"
harness = false

# Deterministic CI perf gate (instruction counts under valgrind). Not run
# locally unless valgrind is installed; see benches/iai_hot_path.rs.
[[bench]]
name = "iai_hot_path"
harness = false

[[bench]]
name = "head_to_head"
harness = false

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
proptest = "1"
criterion = { version = "0.7", features = ["html_reports"] }
iai-callgrind = "0.16"
# Competitor for benches/head_to_head.rs (async circuit breaker).
failsafe = "1.3"

# Model-checking tests (see tests/loom.rs). Activated only with
# RUSTFLAGS="--cfg loom"; the lib swaps parking_lot::RwLock for loom's.
[target.'cfg(loom)'.dependencies]
loom = { version = "0.7", features = ["futures"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(kani)'] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
indexing_slicing = "deny"
panic = "deny"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
